name: Check actionlint plugin candidate
description: Install packaged candidate bytes without a release, exercise plugin fixtures, and check cached execution.
inputs:
  artifact:
    description: Packaged Wasm file or process manifest (default artifacts/plugin.wasm when oci is absent).
    default: ""
  oci:
    description: Public OCI reference pinned by @sha256; mutually exclusive with artifact.
    default: ""
  oci-layout:
    description: Local ORAS image layout containing the pinned oci root; check before uploading an image.
    default: ""
  actionlint:
    description: Host executable; defaults to the actionlint revision pinned by the registry checker.
    default: ""
  fixture:
    description: TypeScript module exporting prepare and verify for the plugin's behavior.
    default: ""
  kind:
    description: Optional execution kind; inferred from the candidate when omitted.
    default: ""
  allow-config-processes:
    description: Explicit consent to run native process plugins in fixture checks.
    default: "false"
  report:
    description: Destination for the candidate receipt used during publication.
    default: candidate.json
outputs:
  sha256:
    description: SHA-256 of the tested release asset bytes or OCI root manifest.
    value: ${{ steps.check.outputs.sha256 }}
  actionlint:
    description: Host executable the candidate was checked with; pass it to the publish action.
    value: ${{ steps.check.outputs.actionlint }}
runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: ${{ github.action_path }}/../go.mod
        cache: false
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: ${{ github.action_path }}/../package.json
    - name: Install registry tooling
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: bun install --cwd "$ACTION_PATH/.." --frozen-lockfile --filter @kjanat-actionlint/registry-tools
    - name: Install and exercise candidate bytes
      id: check
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ARTIFACT: ${{ inputs.artifact }}
        OCI: ${{ inputs.oci }}
        OCI_LAYOUT: ${{ inputs.oci-layout }}
        KIND: ${{ inputs.kind }}
        ALLOW_CONFIG_PROCESSES: ${{ inputs.allow-config-processes }}
        ACTIONLINT: ${{ inputs.actionlint }}
        FIXTURE: ${{ inputs.fixture }}
        REPORT: ${{ inputs.report }}
        REF_TYPE: ${{ github.ref_type }}
      run: |
        tools="$(mktemp -d)"
        trap 'rm -rf -- "$tools"' EXIT
        env -u GOROOT go -C "$ACTION_PATH/.." build -o "$tools/registry" ./cmd/registry
        if [[ -z "$ACTIONLINT" ]]; then
          ACTIONLINT="${RUNNER_TEMP}/actionlint-registry/actionlint"
          mkdir -p "${ACTIONLINT%/*}"
          env -u GOROOT go -C "$ACTION_PATH/../adapters/actionlint" build -trimpath -o "$ACTIONLINT" actionlint.kjanat.dev/v2/cmd/actionlint
        fi
        printf 'actionlint=%s\n' "$ACTIONLINT" >>"$GITHUB_OUTPUT"
        store="$ACTION_PATH/../registry/plugins"
        if [[ "$REF_TYPE" != "tag" ]]; then
          store="$tools/store"
          mkdir "$store"
        fi
        consent=()
        if [[ "$ALLOW_CONFIG_PROCESSES" == "true" ]]; then consent+=(--allow-config-processes); fi
        kind_args=()
        if [[ -n "$KIND" ]]; then kind_args+=(--kind "$KIND"); fi
        layout_args=()
        if [[ -n "$OCI_LAYOUT" ]]; then layout_args+=(--oci-layout "$OCI_LAYOUT"); fi
        checker_args=()
        if [[ -z "$OCI" ]]; then
          env -u GOROOT go -C "$ACTION_PATH/../adapters/actionlint" build -trimpath -o "$tools/checker" .
          checker_args+=(--checker "$tools/checker")
        fi
        bash "$ACTION_PATH/../scripts/validate.sh" bun "$ACTION_PATH/../scripts/cli.ts" check \
          --registry "$tools/registry" --actionlint "$ACTIONLINT" \
          --artifact "$ARTIFACT" --oci "$OCI" --fixture "$FIXTURE" \
          --store "$store" --report "$REPORT" "${checker_args[@]}" "${kind_args[@]}" "${consent[@]}" "${layout_args[@]}"

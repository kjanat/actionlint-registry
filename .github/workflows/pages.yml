name: Publish registry

on:
  push: { branches: [master] }
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  workflow_call:

permissions: {}
cache-mode: none

concurrency:
  group: registry-pages
  queue: max
  cancel-in-progress: false

jobs:
  build:
    # Admission deploys its App commit explicitly before completing the publication lease.
    if: github.event_name != 'push' || github.actor != 'actionlint-plugin-registry[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Read after queue admission so a delayed run cannot republish an older index.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: { go-version-file: go.mod, cache: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { no-cache: true }
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Export static registry
        id: export
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go run ./cmd/registry export \
            --store registry/plugins \
            --output dist \
            --download-counts
          printf 'timestamp=%s\n' "$(date -u +'%Y%m%dT%H%M%SZ')" >> "$GITHUB_OUTPUT"
      - name: Build catalogue site from registry JSON
        run: bun site/cli.ts --input dist --output dist
      - name: Preserve download count observation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: download-counts-${{ steps.export.outputs.timestamp }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/downloads.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
      - name: Check deployed 404 routing and assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';

          const root = process.env.PAGE_URL.replace(/\/?$/, '/');
          const missing = new URL(`plugins/pages-smoke/${process.env.GITHUB_RUN_ID}/missing.json`, root);
          const page = await fetch(missing);
          assert.equal(page.status, 404, page.url);
          const html = await page.text();
          assert.match(html, /<h1>Page not found<\/h1>/);
          const stylesheet = html.match(/<link rel="stylesheet" href="([^"]+)"/)?.[1];
          const browse = html.match(/<a href="([^"]+)">Browse plugins<\/a>/)?.[1];
          assert.ok(stylesheet && browse, 'The 404 page must link to its stylesheet and plugin directory');
          const css = await fetch(new URL(stylesheet, page.url));
          assert.equal(css.status, 200, css.url);
          assert.match(css.headers.get('content-type') ?? '', /^text\/css/i);
          const home = await fetch(new URL(browse, page.url));
          assert.equal(home.status, 200, home.url);
          assert.match(await home.text(), /<h1[^>]*>Plugins for actionlint<\/h1>/);
          JS

name: Publish registry

on:
  push: { branches: [master] }
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  workflow_call:

permissions: {}
cache-mode: none

concurrency:
  group: registry-pages
  queue: max
  cancel-in-progress: false

jobs:
  build:
    # Admission deploys its App commit explicitly before completing the publication lease.
    if: github.event_name != 'push' || github.actor != 'actionlint-plugin-registry[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Read after queue admission so a delayed run cannot republish an older index.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: { go-version-file: go.mod, cache: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { no-cache: true }
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Export static registry
        id: export
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go run ./cmd/registry export \
            --store registry/plugins \
            --output dist \
            --download-counts
          printf 'timestamp=%s\n' "$(date -u +'%Y%m%dT%H%M%SZ')" >> "$GITHUB_OUTPUT"
      - name: Build catalogue site from registry JSON
        run: bun site/cli.ts --input dist --output dist
      - name: Preserve download count observation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: download-counts-${{ steps.export.outputs.timestamp }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/downloads.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
      - name: Check the live 404 page
        continue-on-error: true
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          site=${PAGE_URL%/}
          status=$(curl -sSL --max-time 15 -o missing.html -w '%{http_code}' "$site/plugins/missing-$GITHUB_RUN_ID/record.json")
          test "$status" = 404
          curl -fsSL --max-time 15 "$site/404.html" | cmp - missing.html
          curl -fsSL --max-time 15 -o /dev/null -w '%{content_type}' "$site/assets/site.css" | grep -Eiq '^text/css([[:space:]]*;|$)'

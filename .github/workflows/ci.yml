name: Test

on:
  push: { branches: [master] }
  pull_request:

permissions: { contents: read }
cache-mode: none

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: { go-version-file: go.mod, cache: false }
      - name: Test registry
        run: go test ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with: { version-file: "${{ github.workspace }}/.golangci-lint-version", skip-cache: true }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Check registry CLI types
        run: bun run typecheck
      - name: Test publisher and recovery commands
        run: bun run test
      - name: Install Chromium for catalogue browser tests
        run: bun run --cwd site browser:install
      - name: Check catalogue site
        run: |
          bun run --cwd site typecheck
          bun test --cwd site
          bun run --cwd site test:browser
      - name: Build catalogue from exported registry JSON
        run: |
          go run ./cmd/registry export --store registry/plugins --output dist
          bun site/cli.ts --input dist --output dist

  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: adapters/actionlint } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: { go-version-file: adapters/actionlint/go.mod, cache: false }
      - name: Test actionlint checker
        run: go test ./...
      - name: Lint actionlint checker
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with: { version-file: "../../.golangci-lint-version", working-directory: adapters/actionlint, skip-cache: true }

  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: { go-version-file: adapters/actionlint/go.mod, cache: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { no-cache: true }
      - name: Package fixture
        run: |
          bun install --frozen-lockfile
          mkdir -p "$RUNNER_TEMP/candidate-check"
          bun adapters/actionlint/internal/validation/testdata/candidate.ts package --output "$RUNNER_TEMP/candidate-check/plugin.wasm"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: { go-version: oldstable, cache: false }
      - name: Export the caller's GOROOT as mise does
        run: |
          goroot="$(cd "$RUNNER_TEMP" && go env GOROOT)"
          test -d "$goroot"
          echo "GOROOT=$goroot" >>"$GITHUB_ENV"
      - name: Exercise the shared candidate action
        uses: ./check
        with:
          artifact: ${{ runner.temp }}/candidate-check/plugin.wasm
          fixture: adapters/actionlint/internal/validation/testdata/candidate.ts
          report: ${{ runner.temp }}/candidate-check/receipt.json

  oci-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: adapters/actionlint/go.mod, cache: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { no-cache: true }
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with: { version: 2026.11.10, install: false, cache: false }
      - name: Install the ORAS version pinned in mise.toml
        run: mise install oras
      - name: Package two-platform fixture images
        id: layout
        run: |
          bun install --frozen-lockfile
          oras="$(mise which oras)"
          fixture="$PWD/adapters/actionlint/internal/validation/testdata/candidate.ts"
          dir="$RUNNER_TEMP/oci-candidate"
          layout="$dir/layout"
          printf 'layout=%s\n' "$layout" >>"$GITHUB_OUTPUT"
          for image in good mismatch; do
            contract=kjanat:actionlint/analyzer@0.2.0
            if [[ "$image" == mismatch ]]; then contract=kjanat:actionlint/analyzer@0.3.0; fi
            tags=()
            for platform in linux/amd64 linux/arm64; do
              tag="$image-${platform//\//-}"
              mkdir -p "$dir/$tag"
              bun "$fixture" package --platform "$platform" --interface "$contract" --output "$dir/$tag/plugin.wasm"
              (cd "$dir/$tag" && "$oras" push --oci-layout "$layout:$tag" --artifact-type application/vnd.actionlint.plugin.v1+json --artifact-platform "$platform" plugin.wasm:application/wasm)
              tags+=("$tag")
            done
            "$oras" manifest index create --oci-layout "$layout:$image" "${tags[@]}"
            printf '%s=oci://ghcr.io/kjanat/actionlint-registry-fixture@%s\n' "$image" "$("$oras" resolve --oci-layout "$layout:$image")" >>"$GITHUB_OUTPUT"
          done
      - name: Exercise the shared candidate action on the two-platform image
        uses: ./check
        with:
          oci: ${{ steps.layout.outputs.good }}
          oci-layout: ${{ steps.layout.outputs.layout }}
          fixture: adapters/actionlint/internal/validation/testdata/candidate.ts
          report: ${{ runner.temp }}/oci-candidate/receipt.json
      - name: Exercise the shared candidate action on an image declaring analyzer@0.3.0
        id: mismatch
        continue-on-error: true
        uses: ./check
        with:
          oci: ${{ steps.layout.outputs.mismatch }}
          oci-layout: ${{ steps.layout.outputs.layout }}
          fixture: adapters/actionlint/internal/validation/testdata/candidate.ts
          report: ${{ runner.temp }}/oci-candidate/mismatch.json
      - name: Require the checker to reject the declared analyzer@0.3.0
        env:
          OUTCOME: ${{ steps.mismatch.outcome }}
          REPORT: ${{ runner.temp }}/oci-candidate/mismatch.json
        run: |
          test "$OUTCOME" = failure
          test ! -e "$REPORT"

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { no-cache: true }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: "26.13.1" }
      - name: Install locked dependencies
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Lint Worker
        run: bun run lint
      - name: Check Worker types
        run: bun run typecheck
      - name: Test identity and queue policy
        run: bun test
      - name: Validate Worker deployment bundle
        run: bun run check:bundle
      - name: Test dispatch and recovery in workerd
        run: bun run test:runtime

name: Submit actionlint plugin
description: Submit a release asset or pinned OCI source using GitHub OIDC. Requires id-token write permission.
branding: { icon: package, color: blue }
inputs:
  repository:
    description: Specify the public repository authorizing this source, using owner/repository.
    default: ${{ github.repository }}
  tag:
    description: Specify the exact tag. It must match the tag in the OIDC token.
    default: ${{ github.ref_name }}
  asset:
    description: Specify the exact WASM or process manifest filename attached to the release.
  sha256:
    description: Provide the SHA-256 checksum of the release asset.
  oci:
    description: Submit an existing OCI image by a digest-pinned oci:// reference.
  kind:
    description: Set the execution kind to core, component, or manifest.
    required: true
outputs:
  submission-id:
    description: Use this identifier to check the submission status while validation runs.
    value: ${{ steps.submit.outputs.submission-id }}
  submission-status:
    description: The current submission state; pending and validating are not yet published.
    value: ${{ steps.submit.outputs.submission-status }}
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: ${{ github.action_path }}/package.json
        no-cache: true
    - name: Install registry tooling
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: bun install --cwd "$ACTION_PATH" --frozen-lockfile --filter @kjanat-actionlint/registry-tools
    - name: Submit release metadata with OIDC
      id: submit
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PLUGIN_PROVIDER: github
        PLUGIN_REPOSITORY: ${{ inputs.repository }}
        PLUGIN_TAG: ${{ inputs.tag }}
        PLUGIN_ASSET: ${{ inputs.asset }}
        PLUGIN_SHA256: ${{ inputs.sha256 }}
        PLUGIN_OCI: ${{ inputs.oci }}
        PLUGIN_KIND: ${{ inputs.kind }}
      run: bun "$ACTION_PATH/scripts/cli.ts" submit

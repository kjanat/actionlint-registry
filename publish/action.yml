name: Publish actionlint plugin
description: Publish a Wasm or process release asset, or submit a pinned OCI source, then wait for registry admission.
inputs:
  directory:
    description: Directory containing the candidate package and SHA256SUMS.
    default: artifacts
  asset:
    description: Wasm or process manifest filename within the package.
    default: plugin.wasm
  sha256:
    description: SHA-256 of the packaged release asset.
    default: ""
  oci:
    description: Existing OCI image reference pinned by @sha256. No release upload occurs.
    default: ""
  candidate-receipt:
    description: Successful candidate check receipt for the exact release asset or OCI root.
    default: ""
  actionlint:
    description: Host executable used by the candidate check; defaults to the actionlint revision pinned by the registry checker.
    default: ""
  fixture:
    description: Behavioral fixture used by the candidate check.
    default: ""
  repository:
    description: Public repository containing the release tag.
    default: ${{ github.repository }}
  tag:
    description: Existing release tag matching the calling workflow's OIDC identity.
    default: ${{ github.ref_name }}
  kind:
    description: Execution kind, core, component, or manifest.
    default: component
  allow-config-processes:
    description: Explicit consent to run native process plugins in fixture checks.
    default: "false"
  notes-file:
    description: UTF-8 release notes file; defaults to the commit subjects since the previous published release.
    default: ""
  receipt:
    description: Destination for publication status and validator links, including failures.
    default: publication.json
  timeout-seconds:
    description: Maximum time to wait for publication, including transient HTTP retries.
    default: "1800"
  github-token:
    description: GitHub token with contents write permission. The job also needs id-token write.
    default: ${{ github.token }}
outputs:
  submission-id:
    description: Registry submission identifier.
    value: ${{ steps.publish.outputs.submission-id }}
  submission-status:
    description: Published after admission and catalogue delivery succeed.
    value: ${{ steps.publish.outputs.submission-status }}
  sha256:
    description: Canonical artifact digest; release asset bytes or OCI root digest.
    value: ${{ steps.publish.outputs.sha256 }}
runs:
  using: composite
  steps:
    - if: inputs.actionlint == ''
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: ${{ github.action_path }}/../adapters/actionlint/go.mod
        cache: false
    - name: Build the registry checker host
      id: host
      if: inputs.actionlint == ''
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        host="${RUNNER_TEMP}/actionlint-registry/actionlint"
        mkdir -p "${host%/*}"
        env -u GOROOT go -C "$ACTION_PATH/../adapters/actionlint" build -trimpath -o "$host" actionlint.kjanat.dev/v2/cmd/actionlint
        printf 'actionlint=%s\n' "$host" >>"$GITHUB_OUTPUT"
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: ${{ github.action_path }}/../package.json
        no-cache: true
    - name: Install registry tooling
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: bun install --cwd "$ACTION_PATH/.." --frozen-lockfile --filter @kjanat-actionlint/registry-tools
    - name: Publish verified package and wait for admission
      id: publish
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PACKAGE_DIRECTORY: ${{ inputs.directory }}
        PLUGIN_ASSET: ${{ inputs.asset }}
        PLUGIN_SHA256: ${{ inputs.sha256 }}
        PLUGIN_OCI: ${{ inputs.oci }}
        CANDIDATE_RECEIPT: ${{ inputs.candidate-receipt }}
        ACTIONLINT: ${{ inputs.actionlint || steps.host.outputs.actionlint }}
        FIXTURE: ${{ inputs.fixture }}
        PLUGIN_REPOSITORY: ${{ inputs.repository }}
        PLUGIN_TAG: ${{ inputs.tag }}
        PLUGIN_KIND: ${{ inputs.kind }}
        ALLOW_CONFIG_PROCESSES: ${{ inputs.allow-config-processes }}
        NOTES_FILE: ${{ inputs.notes-file }}
        RECEIPT: ${{ inputs.receipt }}
        TIMEOUT: ${{ inputs.timeout-seconds }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        args=()
        if [[ -n "$NOTES_FILE" ]]; then args+=(--notes-file "$NOTES_FILE"); fi
        if [[ "$ALLOW_CONFIG_PROCESSES" == "true" ]]; then args+=(--allow-config-processes); fi
        if [[ -n "$PLUGIN_OCI" ]]; then
          bun "$ACTION_PATH/../scripts/cli.ts" publish --oci "$PLUGIN_OCI" \
            --candidate-receipt "$CANDIDATE_RECEIPT" \
            --actionlint "$ACTIONLINT" --fixture "$FIXTURE" \
            --repository "$PLUGIN_REPOSITORY" --tag "$PLUGIN_TAG" --kind "$PLUGIN_KIND" \
            --receipt "$RECEIPT" --timeout-seconds "$TIMEOUT" "${args[@]}"
        else
          bun "$ACTION_PATH/../scripts/cli.ts" publish \
            --directory "$PACKAGE_DIRECTORY" --asset "$PLUGIN_ASSET" --sha256 "$PLUGIN_SHA256" \
            --candidate-receipt "$CANDIDATE_RECEIPT" \
            --actionlint "$ACTIONLINT" --fixture "$FIXTURE" \
            --repository "$PLUGIN_REPOSITORY" --tag "$PLUGIN_TAG" --kind "$PLUGIN_KIND" \
            --receipt "$RECEIPT" --timeout-seconds "$TIMEOUT" "${args[@]}"
        fi
    - name: Verify published installation and offline behavior
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ACTIONLINT: ${{ inputs.actionlint || steps.host.outputs.actionlint }}
        FIXTURE: ${{ inputs.fixture }}
        CANDIDATE_RECEIPT: ${{ inputs.candidate-receipt }}
        RELEASE_TAG: ${{ inputs.tag }}
        ALLOW_CONFIG_PROCESSES: ${{ inputs.allow-config-processes }}
      run: |
        consent=()
        if [[ "$ALLOW_CONFIG_PROCESSES" == "true" ]]; then consent+=(--allow-config-processes); fi
        bash "$ACTION_PATH/../scripts/validate.sh" bun "$ACTION_PATH/../scripts/cli.ts" verify-installation \
          --actionlint "$ACTIONLINT" --fixture "$FIXTURE" \
          --receipt "$CANDIDATE_RECEIPT" --tag "$RELEASE_TAG" --report installation.json "${consent[@]}"
